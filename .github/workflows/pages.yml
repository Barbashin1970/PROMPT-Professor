# Дубль сайта курса на GitHub Pages: https://barbashin1970.github.io/PROMPT-Professor/
# Основной сайт — Vercel (публикует site/ как есть). Pages раздаёт репозиторий в подпапке,
# поэтому сюда идёт копия site/ с адресами под /<имя репозитория> — tools/dlya-pages.py.
# Включить один раз: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Дубль сайта на GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/dlya-pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publikaciya.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Копия site/ с адресами под подпапку репозитория
        run: python3 tools/dlya-pages.py --osnova "/${{ github.event.repository.name }}" --vyhod _pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: publikaciya
        uses: actions/deploy-pages@v4
